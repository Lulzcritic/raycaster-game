services:
  postgres:
    image: postgres:16-alpine
    container_name: raycaster_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raycaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raycaster_secret}
      POSTGRES_DB: ${POSTGRES_DB:-raycaster_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raycaster} -d ${POSTGRES_DB:-raycaster_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  raycaster:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_APP_VERSION=${VITE_APP_VERSION:-0.1.1}
    container_name: raycaster-game
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - VITE_APP_VERSION=${VITE_APP_VERSION:-0.1.1}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-raycaster}:${POSTGRES_PASSWORD:-raycaster_secret}@postgres:5432/${POSTGRES_DB:-raycaster_db}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-citadel_admin}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    name: raycaster_postgres_data
