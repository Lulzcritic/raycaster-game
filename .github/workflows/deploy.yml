name: CI & CD Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: 🧪 Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Récupération du dépôt
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Installation des dépendances
        run: npm ci

      - name: 🔨 Vérification TypeScript & Build Vite
        run: npm run build

      - name: 🧪 Exécution de la suite de tests automatisés
        run: npm test

  deploy:
    name: 🚀 Déploiement Serveur Docker
    needs: test
    runs-on: self-hosted
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 🐳 Déploiement et redémarrage Docker
        run: |
          set -e
          APP_DIR="$HOME/raycaster-game"
          echo "📂 Navigation vers $APP_DIR..."
          if [ ! -d "$APP_DIR" ]; then
            echo "Clonage initial du dépôt..."
            git clone https://github.com/Lulzcritic/raycaster-game.git "$APP_DIR"
          fi
          cd "$APP_DIR"

          echo "📥 Récupération du code le plus récent..."
          git fetch origin main
          git reset --hard origin/main

          echo "🐳 Reconstruction et redémarrage du conteneur Docker..."
          docker compose down -t 5 --remove-orphans || true
          docker compose build
          docker compose up -d

          echo "🩺 Vérification de l'état de santé du serveur..."
          sleep 5
          docker compose ps
          curl -f http://localhost:3001/health || (echo "❌ Échec du healthcheck !" && docker compose logs --tail=40 && exit 1)

          echo "✅ Déploiement automatique réussi avec succès !"

